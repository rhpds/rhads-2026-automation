---
ocp4_workload_rhads_customisation_argocd_version: "v3.1.5"
ocp4_workload_rhads_customisation_namespace: tssc-keycloak
ocp4_workload_rhads_customisation_new_size: 10Gi
# Leave these empty to read the real values off the cluster, which is what you want.
# Set one only to override it deliberately.
#
# They used to be built from guid and a hardcoded base domain, which produced a
# hostname that does not resolve: Babylon's guid carries an ordinal suffix, so
# "cluster-{{ guid }}" became cluster-xxxxx-1, and the base domain has moved from
# dynamic.redhatworkshops.io to dyn.redhatworkshops.io. The ingress object knows the
# answer; ask it instead of reconstructing it.
ocp4_workload_rhads_customisation_apps_domain: ""
ocp4_workload_rhads_customisation_ocp_console_url: ""
ocp4_workload_rhads_customisation_logout_redirect_url: ""
ocp4_workload_rhads_customisation_argo_namespace: tssc-gitops
ocp4_workload_rhads_customisation_argo_username: admin
ocp4_workload_rhads_customisation_cluster_context: admin
ocp4_workload_rhads_customisation_kubeconfig_path: "~/.kube/config"
###########################################################
ocp4_workload_rhads_customisation_rhdh_dynamic_template: "dynamic-plugins.yaml.j2"
ocp4_workload_rhads_customisation_rhdh_namespace: "tssc-dh"
ocp4_workload_rhads_customisation_rhdh_cm_name: "tssc-developer-hub-dynamic-plugins"
